services:
  postgres:
    image: postgres:16-alpine
    container_name: emtiaz-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: emtiaz
      POSTGRES_PASSWORD: emtiaz123
      POSTGRES_DB: emtiaz_db
    volumes:
      - emtiaz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emtiaz -d emtiaz_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  emtiaz_postgres_data:
